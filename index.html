<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ayane Labs Legal Pages</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111214;
        --panel: #1b1d21;
        --text: #f3f0e8;
        --muted: #b9b2a5;
        --accent: #d6b35a;
        --border: #31343a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, rgba(214, 179, 90, 0.14), transparent 32rem), var(--bg);
        color: var(--text);
        font-family: Georgia, 'Times New Roman', serif;
        line-height: 1.6;
      }

      main {
        width: min(44rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 5rem 0;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.25rem, 7vw, 4rem);
        line-height: 1;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
      }

      a {
        color: var(--accent);
      }

      .card {
        margin-top: 2rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ayane Labs</h1>
      <p>Public legal pages for mobile apps.</p>
      <section class="card" aria-labelledby="wordle-heading">
        <h2 id="wordle-heading">WORDLE</h2>
        <p><a href="/wordle/privacy.html">Privacy Policy</a></p>
      </section>
      <section class="card" aria-labelledby="word-atlas-heading">
        <h2 id="word-atlas-heading">Word Atlas</h2>
        <p><a href="/word-atlas/privacy.html">Privacy Policy</a></p>
      </section>
    </main>
  </body>
</html>
