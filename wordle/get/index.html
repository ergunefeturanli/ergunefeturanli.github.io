<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WORDLE</title>
  <meta name="description" content="Play WORDLE — the daily word puzzle." />
  <style>
    :root { --bg:#101113; --surface:#17181C; --border:#2A2C33; --accent:#D8B24B; --text:#F5F4EE; --muted:#A4A6AD; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
    }
    .card { max-width:420px; width:100%; }
    h1 { font-size:44px; letter-spacing:8px; margin:0 0 8px; font-weight:800; }
    p { color:var(--muted); margin:0 0 28px; font-size:16px; }
    .links { display:flex; flex-direction:column; gap:12px; }
    a.btn {
      display:block; text-decoration:none; color:var(--text);
      background:var(--surface); border:1px solid var(--border); border-radius:16px;
      padding:16px 20px; font-size:16px; font-weight:600;
    }
    a.btn.primary { background:var(--accent); color:#101113; border-color:var(--accent); }
    .hint { margin-top:20px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <h1>WORDLE</h1>
    <p id="msg">Opening your app store…</p>
    <div class="links">
      <a class="btn primary" id="ios" href="https://apps.apple.com/app/id6771123137">Download on the App Store</a>
      <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.ergunefeturanli.wordle">Get it on Google Play</a>
    </div>
    <p class="hint">Open this link on your phone to install.</p>
  </main>

  <script>
    (function () {
      var IOS_URL = 'https://apps.apple.com/app/id6771123137';
      var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.ergunefeturanli.wordle';
      var ua = navigator.userAgent || navigator.vendor || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS reports as Mac
      var isAndroid = /Android/i.test(ua);
      if (isIOS) {
        window.location.replace(IOS_URL);
      } else if (isAndroid) {
        window.location.replace(ANDROID_URL);
      } else {
        // Desktop / unknown: show both buttons (already visible) instead of redirecting.
        document.getElementById('msg').textContent = 'Get WORDLE on your phone:';
      }
    })();
  </script>
</body>
</html>
